version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cicd-jenkins-app:latest
    container_name: cicd-jenkins-container
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - APP_VERSION=1.0.0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
